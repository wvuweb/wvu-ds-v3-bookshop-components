# Metadata about this component, to be used in the CMS
spec:
  structures:
    - detail_blocks
  label: "Tabs"
  description: Tabbed UI.
  icon: tabs
  tags: []

# Defines the structure of this component, as well as the default values
blueprint:
  heading: Heading
  subheading: Subheading.
  aria_label:
  copy:
  items:
    - title: Item 1 Title
      image:
      alt_text:
      date: January 1, 1111
      time: 12:00 PM
      icon: clock
      text: Item 1 text.
      ctas:
  settings:
    styles:
      audience: general
      tone: default
      color_palette: option-1
      bg_subtle:
    layout:
      buffer:
      padding: py-6 py-xxl-7
    config:
      name: featurettes-w-icons-vertical
      edit_mode_only: false
      include_heading_postscript: false
  is_dynamic: false
  is_nested: false
  use_common_wrapper: true

# Overrides any fields in the blueprint when viewing this component in the component browser
preview:

# Any extra CloudCannon inputs configuration to apply to the blueprint
_inputs:
  alt_text:
    hidden: '!image'
    options:
      required: true
  aria_label:
    label: ARIA Label
    hidden: 'heading'
    options:
      required: true
    context:
      content: If your component doesn’t have a heading, it needs an <a href="https://developer.mozilla.org/en-US/docs/Web/Accessibility/ARIA/Reference/Attributes/aria-label">ARIA label</a> to be accessible. Enter a concise label to provide a clear and useful name for this component e.g. “Featured News Stories.”
  audience:
    type: choice
    options:
      allow_empty: false
      values:
        - name: General
          class: general
        - name: Academic / Traditional
          class: alumni
        - name: Modern + Formal
          class: leaders_partners
        - name: Prospective Students
          class: prospective_students
      value_key: class
    label: Style
  bg_subtle:
    type: checkbox
  buffer:
    type: select
    options:
      allow_empty: true
      values: _select_data.buffers
      value_key: class
    cascade: true
  color_palette:
    type: choice
    options:
      allow_empty: false
      values: _select_data.color_palettes
      value_key: class
    cascade: true
  copy:
    type: markdown
    options:
      bold: true
      bulletedlist: true
      embed: true
      format: p h1 h2 h3 h4 h5 h6 pre address div
      italic: true
      image: false
      indent: true
      join_above: true
      join_below: true
      link: true
      numberedlist: true
      outdent: true
      strike: true
      subscript: true
      superscript: true
      table: true
      underline: true
      code: true
      style: /assets/scss/custom/_content.scss
  ctas:
    type: array
    options:
      structures: _structures.links
  heading:
    options:
      required: true
  image:
    type: image
    options:
      allowed_sources:
        - ccdam
      width: 1920
      height: 1080
  include_heading_postscript:
    hidden: true
  text:
    type: markdown
    options:
      bold: true
      bulletedlist: true
      embed: true
      format: p h1 h2 h3 h4 h5 h6 pre address div
      italic: true
      image: false
      indent: true
      join_above: true
      join_below: true
      link: true
      numberedlist: true
      outdent: true
      strike: true
      subscript: true
      superscript: true
      table: true
      underline: true
      code: true
      style: /assets/scss/custom/_content.scss
  margin:
    type: select
    options:
      allow_empty: true
      values: _select_data.container_margins
      value_key: class
    cascade: true
  padding:
    type: auto
    hidden: true
  tone:
    type: choice
    options:
      allow_empty: false
      values:
        - name: Default
          class: default
        - name: Reserved
          class: reserved
        - name: Loud
          class: loud
        - name: Let’s Go!
          class: lets-go
      value_key: class
  settings:
    type: object
    options:
      subtype: tabbed
  use_common_wrapper:
    type: auto
    hidden: true
_select_data:
  buffers:
    - name: Buffer Top
      class: pt-6
    - name: Buffer Bottom
      class: pb-6
    - name: Buffer Both
      class: py-6
  color_palettes:
    - name: Option 1
      class: option-1
    - name: Option 2
      class: option-2
    - name: Option 3
      class: option-3
    - name: Option 4
      class: option-4
    - name: Option 5
      class: option-5
    - name: Option 6
      class: option-6
    - name: Option 7
      class: option-7
    - name: Option 8
      class: option-8
  container_margins:
    - name: Pull Up
      class: mt-n8 mt-xxl-n9
  tint_opacities:
    - name: None
      value: '0.0'
    - name: Light
      value: '0.3'
    - name: Medium
      value: '0.5'
    - name: Dark
      value: '0.7'
_structures:
  links:
    values:
      - value:
          text:
          icon:
          url: