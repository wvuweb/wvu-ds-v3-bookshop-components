<div class="alert alert-{{ .alert_type | urlize }} p-4 my-4">
  <div class="d-flex d-flex-row">
    {{ with .icon }}
      <div class="text-center pe-3 mt-1">
        <span class="fa-regular fa-{{ . }} display-5"></span>
      </div>
    {{ end }}
    <div class="">
      {{ with .heading }}
        <h2 class="fs-3">{{ . }}</h2>
      {{ end }}
      {{ .markdown | markdownify }}
    </div>
  </div>
</div>
